name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt pytest playwright && python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: App smoke test (real window, WebView2)
        run: |
          pip install -r requirements.txt
          python tools/fetch_webview2.py
          python tests/smoke_app.py
        env:
          MVDL_SHOTS: ${{ runner.temp }}/shots
      - uses: actions/upload-artifact@v4
        if: failure()  # only to look into a failed run; artifacts count against the storage quota
        continue-on-error: true
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          retention-days: 3
      - run: powershell -ExecutionPolicy Bypass -File build.ps1
      - name: The built exe starts and its browser comes up
        run: |
          $env:MVDL_STARTUP_CHECK = "$env:RUNNER_TEMP\startup.txt"
          $p = Start-Process dist\mvdl.exe -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'mvdl.exe did not finish starting' }
          if (-not (Test-Path $env:MVDL_STARTUP_CHECK)) { throw "mvdl.exe exited ($($p.ExitCode)) before its browser came up" }
          "WebView2: $(Get-Content $env:MVDL_STARTUP_CHECK)"
      - name: Which release (a v* tag, or a version on main that has no release yet)
        id: rel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = ''
          if ('${{ github.ref }}'.StartsWith('refs/tags/v')) {
            $tag = '${{ github.ref_name }}'
          } elseif ('${{ github.event_name }}' -eq 'push' -and '${{ github.ref }}' -eq 'refs/heads/main') {
            $v = (Select-String -Path mvdl/__init__.py -Pattern "__version__ = '([^']+)'").Matches[0].Groups[1].Value
            gh api "repos/${{ github.repository }}/git/ref/tags/v$v" *> $null
            if ($LASTEXITCODE -eq 0) { "v$v is released already" } else { $tag = "v$v" }
          }
          "release: '$tag'"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0
      - name: Release
        if: steps.rel.outputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          # a release made on GitHub first (which also makes the tag) only gets the files;
          # otherwise the release makes the tag, on this commit
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG dist/mvdl-win64.zip dist/mvdl.exe --clobber
          } else {
            gh release create $env:TAG dist/mvdl-win64.zip dist/mvdl.exe --title $env:TAG --target ${{ github.sha }} --generate-notes
          }
