name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: App smoke test (real window, WebView2)
        run: |
          pip install -r requirements.txt
          python tools/fetch_webview2.py
          python tests/smoke_app.py
      - run: powershell -ExecutionPolicy Bypass -File build.ps1
      - name: The built exe starts and its browser comes up
        run: |
          $env:MVDL_STARTUP_CHECK = "$env:RUNNER_TEMP\startup.txt"
          $p = Start-Process dist\mvdl.exe -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'mvdl.exe did not finish starting' }
          if (-not (Test-Path $env:MVDL_STARTUP_CHECK)) { throw "mvdl.exe exited ($($p.ExitCode)) before its browser came up" }
          "WebView2: $(Get-Content $env:MVDL_STARTUP_CHECK)"
      - uses: actions/upload-artifact@v4
        with:
          name: mvdl-win64
          path: dist/mvdl-win64.zip
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist/mvdl-win64.zip dist/mvdl.exe --title ${{ github.ref_name }} --generate-notes
